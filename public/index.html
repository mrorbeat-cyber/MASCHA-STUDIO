<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASCHA STUDIO</title>
<style>
:root{--bg:#070b11;--panel:#0e1721;--line:#235761;--text:#f7fafc;--muted:#94a4b3;--teal:#25d6c4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17333b,#071019 42%,#05090e);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--teal)}button{border:1px solid #324957;border-radius:9px;padding:9px 12px;background:#172531;color:#fff;font-weight:800;cursor:pointer}button.primary,.active{background:var(--teal);color:#03201d;border-color:var(--teal)}button:disabled{opacity:.4}textarea,select,input[type=number]{width:100%;background:#07131c;color:#fff;border:1px solid #294958;border-radius:8px;padding:9px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.card{background:rgba(14,23,33,.96);border:1px solid var(--line);border-radius:16px;padding:14px}.label{display:block;font-size:11px;font-weight:900;margin:12px 0 5px}.muted,.hint{color:var(--muted);font-size:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btns,.history{display:flex;gap:6px;flex-wrap:wrap}.files{display:grid;grid-template-columns:1fr 1fr;gap:7px}.files label{font-size:10px;font-weight:800}.files input{width:100%;font-size:10px}.previewWrap{position:relative}.preview{height:min(70vh,720px);min-height:470px;position:relative;overflow:hidden;border:1px dashed #385163;border-radius:14px;background:#020506;display:grid;place-items:center}.preview img{position:absolute;user-select:none;touch-action:none;-webkit-user-drag:none;cursor:grab}.preview img.drag{cursor:grabbing}.panel{position:absolute;right:10px;top:10px;width:250px;padding:10px;background:rgba(8,13,18,.95);border:1px solid var(--line);border-radius:12px;z-index:5}.panel h3{font-size:11px;margin:0 0 7px}.layers,.vis{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.layers button,.vis button{font-size:10px;padding:7px 3px}.controls{display:grid;gap:6px;margin-top:8px}.controls label{font-size:10px;font-weight:800}.controls input{width:100%}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.actions button{font-size:9px;padding:7px 2px}.status{color:var(--muted);font-size:11px;min-height:18px;margin-top:10px}.export{display:flex;gap:7px;margin-top:10px}.export select{flex:1}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview{min-height:420px;height:65vh}.panel{position:relative;right:auto;top:auto;width:100%;margin-top:10px}.previewWrap{display:flex;flex-direction:column}.export{flex-direction:column}}
</style>
</head>
<body><main>
<header class="top"><div class="brand">MASCHA <b>STUDIO</b></div><div class="history"><button id="new">NUEVO</button><button id="undo" disabled title="Retroceder">↶</button><button id="redo" disabled title="Adelantar">↷</button></div><span class="muted">POD · AHORRO INTELIGENTE</span></header>
<div class="layout"><section class="card"><h2>Crear composición</h2><div class="muted">Cada archivo queda en su propia capa.</div><label class="label">PROMPT</label><textarea id="prompt" placeholder="Describe producto, escena y estilo..."></textarea><div class="row"><div><label class="label">MODO</label><select id="mode"><option value="preview">Previsualización</option><option value="final">Alta calidad</option></select></div><div><label class="label">TOPE USD</label><input id="cap" type="number" value="10"></div></div><div class="btns"><button class="primary" id="generate">GENERAR RESULTADO</button><button id="saveCap">GUARDAR TOPE</button></div><label class="label">CARGAS LOCALES</label><div class="files"><label>FONDO<input id="backgroundFile" type="file" accept="image/*"></label><label>PRODUCTO<input id="productFile" type="file" accept="image/*"></label><label>DISEÑO<input id="designFile" type="file" accept="image/*"></label><label>MÁSCARA<input id="maskFile" type="file" accept="image/*"></label><label>PLIEGUES<input id="displacementFile" type="file" accept="image/*"></label></div><label class="label">COLOR DEL PRODUCTO</label><input id="color" type="color" value="#ffffff"><div id="status" class="status">Preparado.</div></section>
<section class="card"><h2>Área de trabajo</h2><div class="previewWrap"><div id="preview" class="preview"><div id="empty" class="muted">Carga una imagen para comenzar.</div><img id="background"><img id="product"><img id="design"></div><aside class="panel"><h3>CAPA ACTIVA: <span id="activeName">DISEÑO</span></h3><div class="layers"><button data-layer="background">FONDO</button><button data-layer="product">PRODUCTO</button><button data-layer="design" class="active">DISEÑO</button></div><div class="vis"><button data-vis="background">FONDO</button><button data-vis="product">PRODUCTO</button><button data-vis="design">DISEÑO</button></div><div class="controls"><label>TAMAÑO <output id="sizeOut">34%</output><input id="size" type="range" min="5" max="200" value="34"></label><label>ROTACIÓN <output id="rotOut">0°</output><input id="rot" type="range" min="-180" max="180" value="0"></label><label>HORIZONTAL <output id="xOut">50%</output><input id="x" type="range" min="0" max="100" value="50"></label><label>VERTICAL <output id="yOut">50%</output><input id="y" type="range" min="0" max="100" value="50"></label><div class="actions"><button id="center">CENTRAR</button><button id="reset">REINICIAR</button><button id="hide">OCULTAR</button></div></div><div class="hint">Selecciona una capa o toca la imagen. Arrastra con mouse o dedo.</div></aside></div><div class="export"><select id="format"><option value="1600x1600">Web — 1600 px</option><option value="1080x1080">Instagram — 1080 px</option><option value="1200x1500">Facebook — 1200 × 1500</option><option value="3000x3000">Impresión — alta definición</option></select><button id="download">DESCARGAR PNG</button></div></section></div></main>
<script>
(()=>{const q=id=>document.getElementById(id),names=['background','product','design'],L={};names.forEach(k=>L[k]={el:q(k),x:50,y:50,size:k==='design'?34:100,rot:0,visible:true,src:''});let active='design',undo=[],redo=[],last='';const msg=t=>{q('status').textContent=t;q('activeName').textContent=active.toUpperCase()};const state=()=>JSON.stringify(names.map(k=>{let s=L[k];return {k,x:s.x,y:s.y,size:s.size,rot:s.rot,visible:s.visible,src:s.src}}));function commit(){let n=state();if(last&&n!==last){undo.push(last);if(undo.length>60)undo.shift();redo=[]}last=n;q('undo').disabled=!undo.length;q('redo').disabled=!redo.length}function draw(){names.forEach(k=>{let s=L[k],e=s.el;e.classList.toggle('hidden',!s.visible||!s.src);e.style.display=s.visible&&s.src?'block':'none';e.style.left=s.x+'%';e.style.top=s.y+'%';e.style.width=k==='background'?'100%':s.size+'%';e.style.height=k==='background'?'100%':'auto';e.style.objectFit=k==='background'?'cover':'contain';e.style.transform=k==='background'?'none':'translate(-50%,-50%) rotate('+s.rot+'deg)';e.style.pointerEvents=s.src?'auto':'none'});let s=L[active];q('size').value=s.size;q('rot').value=s.rot;q('x').value=s.x;q('y').value=s.y;q('sizeOut').textContent=Math.round(s.size)+'%';q('rotOut').textContent=Math.round(s.rot)+'°';q('xOut').textContent=Math.round(s.x)+'%';q('yOut').textContent=Math.round(s.y)+'%';document.querySelectorAll('[data-layer]').forEach(b=>b.classList.toggle('active',b.dataset.layer===active));msg('Capa activa: '+active.toUpperCase())}function select(k){active=k;draw()}function load(k,f){if(!f)return;let u=URL.createObjectURL(f);L[k].src=u;L[k].el.src=u;L[k].visible=true;select(k);commit();draw();msg('Cargado en capa '+k.toUpperCase()+'. Puedes moverlo y cambiar tamaño.')}document.addEventListener('click',e=>{let l=e.target.closest('[data-layer]'),v=e.target.closest('[data-vis]');if(l){select(l.dataset.layer);e.stopImmediatePropagation()}else if(v){L[v.dataset.vis].visible=!L[v.dataset.vis].visible;commit();draw();e.stopImmediatePropagation()}},true);document.addEventListener('change',e=>{let map={backgroundFile:'background',productFile:'product',designFile:'design'};if(map[e.target.id]){e.stopImmediatePropagation();load(map[e.target.id],e.target.files[0])}},true);document.addEventListener('input',e=>{let map={size:'size',rot:'rot',x:'x',y:'y'};if(map[e.target.id]){L[active][map[e.target.id]]=Number(e.target.value);draw();e.stopImmediatePropagation()}if(e.target.id==='color'){select('product');L.product.el.style.filter='none';L.product.el.style.backgroundColor=e.target.value;commit();msg('Color aplicado a Producto. Para precisión usa PNG transparente o máscara.')}},true);let drag=null;q('preview').addEventListener('pointerdown',e=>{let k=names.find(n=>e.target===L[n].el&&L[n].src);if(!k)return;select(k);drag={k,sx:e.clientX,sy:e.clientY,x:L[k].x,y:L[k].y};e.target.classList.add('drag');q('preview').setPointerCapture?.(e.pointerId);e.preventDefault();e.stopImmediatePropagation()},true);q('preview').addEventListener('pointermove',e=>{if(!drag)return;let b=q('preview').getBoundingClientRect(),s=L[drag.k];s.x=Math.max(0,Math.min(100,drag.x+(e.clientX-drag.sx)/b.width*100));s.y=Math.max(0,Math.min(100,drag.y+(e.clientY-drag.sy)/b.height*100));draw();e.preventDefault()},true);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>q('preview').addEventListener(ev,()=>{if(drag){drag.el?.classList.remove('drag');drag=null;commit()}}));q('center').onclick=()=>{L[active].x=50;L[active].y=50;commit();draw()};q('reset').onclick=()=>{Object.assign(L[active],{x:50,y:50,size:active==='design'?34:100,rot:0});commit();draw()};q('hide').onclick=()=>{L[active].visible=!L[active].visible;commit();draw()};q('undo').onclick=()=>{if(!undo.length)return msg('No hay cambios para retroceder.');redo.push(state());let a=JSON.parse(undo.pop());a.forEach(v=>Object.assign(L[v.k],v));last=state();draw()};q('redo').onclick=()=>{if(!redo.length)return msg('No hay cambios para adelantar.');undo.push(state());let a=JSON.parse(redo.pop());a.forEach(v=>Object.assign(L[v.k],v));last=state();draw()};q('new').onclick=()=>{names.forEach(k=>{Object.assign(L[k],{x:50,y:50,size:k==='design'?34:100,rot:0,visible:false,src:''});L[k].el.removeAttribute('src')});undo=[];redo=[];last=state();draw();msg('Nueva composición limpia creada.')};q('generate').onclick=async()=>{let p=q('prompt').value.trim();if(!p)return msg('Escribe un prompt.');let fd=new FormData();fd.append('prompt',p);fd.append('mode',q('mode').value);q('generate').disabled=true;msg('Generando...');try{let r=await fetch('/api/generate',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||'Error de generación');let b=await fetch(d.image).then(r=>r.blob());load('background',new File([b],'generated.png',{type:b.type}))}catch(e){msg(e.message)}finally{q('generate').disabled=false}};q('download').onclick=()=>{let [w,h]=q('format').value.split('x').map(Number),c=document.createElement('canvas'),ctx=c.getContext('2d'),p=q('preview').getBoundingClientRect();c.width=w;c.height=h;names.forEach(k=>{let s=L[k],e=s.el;if(!s.visible||!s.src||!e.naturalWidth)return;let sc=Math.min(w/p.width,h/p.height),iw=e.naturalWidth*sc*(k==='background'?w/p.width:s.size/100),ih=e.naturalHeight*sc*(k==='background'?h/p.height:s.size/100);ctx.save();ctx.translate(w*s.x/100,h*s.y/100);ctx.rotate(s.rot*Math.PI/180);ctx.drawImage(e,-iw/2,-ih/2,iw,ih);ctx.restore()});let a=document.createElement('a');a.download='mascha-composicion.png';a.href=c.toDataURL('image/png');a.click()};last=state();draw()})();
</script>
<style id="final-layout-fix">
.previewWrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}.previewWrap .preview{grid-column:1}.previewWrap .panel{position:relative;right:auto;top:auto;width:270px;max-width:none;grid-column:2;grid-row:1;margin:0}.preview img#background{object-fit:contain!important}
@media(max-width:800px){.previewWrap{display:flex;flex-direction:column}.previewWrap .panel{width:100%;max-width:none;margin-top:10px}}
</style>
<script>
(()=>{const b=document.getElementById('background');if(b)b.style.objectFit='contain';})();
</script>
<script>
(()=>{
 const format=document.getElementById('format'), download=document.getElementById('download');
 if(format){format.innerHTML='<option value="1600x1600|png">Web — PNG 1600 px</option><option value="1200x1500|png">Facebook — PNG 1200 × 1500</option><option value="1080x1080|jpg">Instagram — JPG 1080 × 1080</option><option value="1080x1920|jpg">TikTok / Historia — JPG 1080 × 1920</option><option value="3000x3000|png">Impresión — PNG alta definición</option><option value="custom|png">Personalizado</option>'}
 const panel=document.querySelector('.panel');
 if(panel&&!document.getElementById('fusion')){const b=document.createElement('button');b.id='fusion';b.textContent='APLICAR FUSIÓN';b.title='Integra el diseño usando máscara y mapa de pliegues';b.style.width='100%';b.style.marginTop='7px';panel.appendChild(b);b.onclick=()=>{const hasMask=document.getElementById('maskFile')?.files?.length;const hasDisp=document.getElementById('displacementFile')?.files?.length;if(!hasMask&&!hasDisp){document.getElementById('status').textContent='Carga una máscara y un mapa de pliegues para aplicar fusión real.';return}document.getElementById('status').textContent=hasDisp?'Mapa de pliegues preparado para fusión del diseño.':'Máscara aplicada; falta mapa de pliegues para deformación.'}}
 if(download){download.textContent='DESCARGAR';download.onclick=()=>{let val=format.value.split('|'),size=val[0],type=val[1]||'png';let wh=size==='custom'?prompt('Escribe ancho x alto, por ejemplo 2000x1500','2000x1500'):size;if(!wh||!/^[0-9]+x[0-9]+$/.test(wh))return;let [w,h]=wh.split('x').map(Number),c=document.createElement('canvas'),ctx=c.getContext('2d'),p=document.getElementById('preview').getBoundingClientRect();c.width=w;c.height=h;['background','product','design'].forEach(k=>{let s=window.__MASCHA_LAYER_MANAGER__?.layers?.[k],e=document.getElementById(k);if(!s||!s.visible||!s.src||!e.naturalWidth)return;let sc=Math.min(w/p.width,h/p.height),iw=e.naturalWidth*sc*(k==='background'?w/p.width:s.size/100),ih=e.naturalHeight*sc*(k==='background'?h/p.height:s.size/100);ctx.save();ctx.translate(w*s.x/100,h*s.y/100);ctx.rotate(s.rot*Math.PI/180);ctx.drawImage(e,-iw/2,-ih/2,iw,ih);ctx.restore()});let mime=type==='jpg'?'image/jpeg':type==='webp'?'image/webp':'image/png',a=document.createElement('a');a.download='mascha-composicion.'+type;a.href=c.toDataURL(mime,.95);a.click()}}
})();
</script>
<script>
(()=>{const d=document.getElementById('download'),f=document.getElementById('format');if(!d)return;d.onclick=()=>{let parts=(f.value||'1600x1600|png').split('|'),wh=parts[0];if(wh==='custom')wh=prompt('Escribe ancho x alto','2000x1500');if(!wh||!/^[0-9]+x[0-9]+$/.test(wh))return;let [w,h]=wh.split('x').map(Number),c=document.createElement('canvas'),x=c.getContext('2d'),p=document.getElementById('preview').getBoundingClientRect();c.width=w;c.height=h;['background','product','design'].forEach(id=>{let e=document.getElementById(id);if(!e||e.style.display==='none'||!e.src||!e.naturalWidth)return;let r=e.getBoundingClientRect(),sx=w/p.width,sy=h/p.height;x.drawImage(e,(r.left-p.left)*sx,(r.top-p.top)*sy,r.width*sx,r.height*sy)});let ext=parts[1]||'png',mime=ext==='jpg'?'image/jpeg':ext==='webp'?'image/webp':'image/png',a=document.createElement('a');a.download='mascha-composicion.'+ext;a.href=c.toDataURL(mime,.95);a.click()}})();
</script>
<script id="visual-fusion-compat">
(()=>{
 const d=document.getElementById('design'),m=document.getElementById('maskFile'),p=document.querySelector('.panel');
 if(!d)return;
 const apply=()=>{
  if(d.style.display==='none'){const s=document.getElementById('status');if(s)s.textContent='Carga primero un Diseño para aplicar fusión.';return}
  d.style.mixBlendMode='multiply';d.style.opacity='.94';d.style.filter='contrast(1.12) saturate(1.06) drop-shadow(0 2px 3px rgba(0,0,0,.38))';
  const f=m?.files?.[0];if(f){const u=URL.createObjectURL(f);d.style.webkitMaskImage='url("'+u+'")';d.style.maskImage='url("'+u+'")';d.style.webkitMaskSize='100% 100%';d.style.maskSize='100% 100%';d.style.webkitMaskRepeat='no-repeat';d.style.maskRepeat='no-repeat'}
  const s=document.getElementById('status');if(s)s.textContent='Fusión visual aplicada: mezcla, sombras y máscara activas.';
 };
 if(p&&!document.getElementById('fusionVisual')){const b=document.createElement('button');b.id='fusionVisual';b.textContent='FUSIÓN VISUAL';b.title='Recupera el efecto visual de integración de la versión anterior';b.style.width='100%';b.style.marginTop='7px';p.appendChild(b);b.onclick=apply}
 m?.addEventListener('change',()=>{if(d.style.mixBlendMode==='multiply')apply()});
})();
</script>
<script id="export-transform-fix">
(()=>{const b=document.getElementById('download'),f=document.getElementById('format');if(!b)return;b.onclick=()=>{let [fmt,type]=(f.value||'1600x1600|png').split('|'),wh=fmt==='custom'?prompt('Escribe ancho x alto','2000x1500'):fmt;if(!wh||!/^[0-9]+x[0-9]+$/.test(wh))return;let [W,H]=wh.split('x').map(Number),c=document.createElement('canvas'),ctx=c.getContext('2d'),p=document.getElementById('preview'),pw=p.clientWidth,ph=p.clientHeight;c.width=W;c.height=H;const sx=W/pw,sy=H/ph;['background','product','design'].forEach(id=>{let e=document.getElementById(id),cs=getComputedStyle(e);if(!e||cs.display==='none'||!e.src||!e.naturalWidth)return;let left=parseFloat(e.style.left)||50,top=parseFloat(e.style.top)||50,rot=(e.style.transform.match(/rotate\(([-0-9.]+)deg\)/)||[])[1]||0;ctx.save();if(id==='background'){let sc=Math.min(pw/e.naturalWidth,ph/e.naturalHeight),iw=e.naturalWidth*sc,ih=e.naturalHeight*sc;ctx.drawImage(e,(pw-iw)/2*sx,(ph-ih)/2*sy,iw*sx,ih*sy)}else{let w=(parseFloat(e.style.width)||34)/100*pw,h=w*e.naturalHeight/e.naturalWidth;ctx.translate(left/100*pw*sx,top/100*ph*sy);ctx.rotate(Number(rot)*Math.PI/180);ctx.drawImage(e,-w*sx/2,-h*sy/2,w*sx,h*sy)}ctx.restore()});let ext=type||'png',mime=ext==='jpg'?'image/jpeg':ext==='webp'?'image/webp':'image/png',a=document.createElement('a');a.download='mascha-composicion.'+ext;a.href=c.toDataURL(mime,.95);a.click()}})();
</script></body></html>

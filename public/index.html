<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Dinámico de Mockup de Mug - Beta 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 flex flex-col items-center justify-center min-h-screen">

    <div class="max-w-4xl w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Panel de Visualización (Mockup) -->
        <div class="flex flex-col items-center justify-center bg-slate-950 p-6 rounded-xl relative overflow-hidden border border-slate-800">
            <h3 class="text-xs uppercase tracking-wider text-slate-400 mb-4">Vista Previa del Mockup</h3>
            
            <!-- Simulación de Taza / Mug -->
            <div id="mug-container" class="relative w-64 h-72 bg-gradient-to-r from-slate-200 via-white to-slate-300 rounded-3xl shadow-inner flex items-center justify-center overflow-hidden border-4 border-slate-400">
                <!-- Área de impresión / Diseño -->
                <div id="design-area" class="absolute w-40 h-40 border-2 border-dashed border-sky-400/50 flex flex-col items-center justify-center p-2 text-center cursor-move">
                    <img id="preview-img" class="max-h-24 max-w-full object-contain mb-2 hidden" alt="Diseño subido">
                    <span id="preview-text" class="text-slate-900 font-bold text-lg drop-shadow-sm select-none">Tu Texto Aquí</span>
                </div>
            </div>
            <span class="text-xs text-slate-500 mt-3">Taza Cilíndrica 15 oz (Área Sublimación)</span>
        </div>

        <!-- Panel de Control y Edición -->
        <div class="flex flex-col space-y-4">
            <h2 class="text-xl font-bold text-sky-400">Panel de Control & IA</h2>

            <!-- Subir Imagen -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Subir Imagen / Logo</label>
                <input type="file" id="image-upload" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer">
            </div>

            <!-- Editar Texto -->
            <div class="space-y-3">
                <label class="block text-sm font-medium text-slate-300">Personalizar Texto</label>
                <input type="text" id="text-input" value="Tu Texto Aquí" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400">Tamaño de Fuente</label>
                        <input type="range" id="font-size" min="12" max="36" value="18" class="w-full accent-sky-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Color del Texto</label>
                        <input type="color" id="text-color" value="#0f172a" class="w-full h-8 bg-transparent cursor-pointer rounded">
                    </div>
                </div>
            </div>

            <!-- Panel IA Activa -->
            <div class="bg-slate-900 p-4 rounded-xl border border-sky-500/30 space-y-2 mt-auto">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-sky-400 uppercase tracking-wide">Asistente IA Activo</span>
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>
                <input type="text" id="ai-prompt" placeholder="Ej: Cambia el texto a mayúsculas y pon color rojo..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                <button onclick="runAIAssistant()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition-colors">
                    Aplicar con IA
                </button>
            </div>

        </div>
    </div>

    <script>
        // Referencias del DOM
        const imageUpload = document.getElementById('image-upload');
        const previewImg = document.getElementById('preview-img');
        const textInput = document.getElementById('text-input');
        const previewText = document.getElementById('preview-text');
        const fontSize = document.getElementById('font-size');
        const textColor = document.getElementById('text-color');
        const aiPrompt = document.getElementById('ai-prompt');

        // Eventos de personalización en tiempo real
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewImg.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        textInput.addEventListener('input', (e) => {
            previewText.textContent = e.target.value;
        });

        fontSize.addEventListener('input', (e) => {
            previewText.style.fontSize = e.target.value + 'px';
        });

        textColor.addEventListener('input', (e) => {
            previewText.style.color = e.target.value;
        });

        // Simulación de respuesta de IA para modificaciones rápidas
        function runAIAssistant() {
            const promptText = aiPrompt.value.toLowerCase();
            if (!promptText) return;

            if (promptText.includes('mayuscula') || promptText.includes('mayúsculas')) {
                textInput.value = textInput.value.toUpperCase();
                previewText.textContent = textInput.value;
            }
            if (promptText.includes('rojo')) {
                textColor.value = '#ef4444';
                previewText.style.color = '#ef4444';
            }
            if (promptText.includes('azul')) {
                textColor.value = '#38bdf8';
                previewText.style.color = '#38bdf8';
            }
            if (promptText.includes('grande')) {
                fontSize.value = '32';
                previewText.style.fontSize = '32px';
            }

            aiPrompt.value = '';
            alert('¡Cambios aplicados por la IA con éxito!');
        }
    </script>
</body>
</html>
